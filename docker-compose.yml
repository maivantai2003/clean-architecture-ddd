version: "3.9"
networks:
  microservice-net:
    driver: bridge
volumes:
  es-data:
  rabbitmq_data:
  redis_data:
  # auth_db_data:
  # user_db_data:
  # auth_redis_data:
  # user_redis_data:
  
services:
    redis:
          image: redis:7
          container_name: redis-microservice
          ports:
            - "6379:6379"
          volumes:
            - redis_data:/data
          networks:
            - microservice-net
    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
      container_name: elasticsearch
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - ES_JAVA_OPTS=-Xms512m -Xmx512m
      ports:
        - "9200:9200"
        - "9300:9300"
      volumes:
        - es-data:/usr/share/elasticsearch/data
      networks: 
        - microservice-net
    rabbit-mq:
      image: rabbitmq:3-management
      container_name: rabbitmq-dev
      ports:
        - "5672:5672"
        - "15672:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      networks:
        - microservice-net
